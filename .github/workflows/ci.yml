name: ci

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run tests
        run: cargo test --workspace --all-features

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build GPUI stack (Metal)
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build forms-demo app (release)
        run: cargo build --release -p forms-demo

      - name: Upload forms-demo binary
        uses: actions/upload-artifact@v4
        with:
          name: forms-demo-macos
          path: target/release/forms-demo

      - name: Storybook apps (informational — not buildable yet)
        continue-on-error: true
        run: |
          echo "::warning::gpui-form-component-story and examples/some-lib-forms are workspace-excluded (they depend on the vendored gallery that still targets the retired longbridge/gpui-component API) and cannot compile until that gallery is revived."
          cargo check --manifest-path crates/gpui-form-component-story/Cargo.toml

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Lint code
        run: cargo clippy --workspace --all-features

  machete:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Machete
        uses: bnjbvr/cargo-machete@main
