[workspace]
default-members = [ "examples/some-lib" ]
members = [
  "crates/gpui-form",
  "crates/gpui-form-core",
  "crates/gpui-form-codegen",
  "crates/gpui-form-component",
  "crates/gpui-form-component-derive",
  "crates/gpui-form-schema",
  "crates/gpui-form-derive",
  "crates/gpui-form-i18n",
  "crates/gpui-form-collection",
  "crates/gpui-form-collection-derive",
  "crates/gpui-form-mcp",
  "crates/gpui-form-prototyping-core",
  "examples/some-lib",
  "examples/forms-demo",
  "examples/prototyping",
  "examples/mcp-submit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-form"
rust-version = "1.95"
version = "0.5.2"

[workspace.dependencies]
anyhow = "1.0"
bon = "3.9"
chrono = "0.4"
component-shape = "0.3.3"
component-shape-gpui = "0.3.3"
component-shape-mcp = "0.3.3"
darling = "0.23"
derive_more = "2.1"
gpui = { package = "gpui-pre", version = "0.3.7" }
gpui-form = { path = "crates/gpui-form", version = "0.5.2" }
gpui-form-codegen = { path = "crates/gpui-form-codegen", version = "0.5.2" }
gpui-form-component = { path = "crates/gpui-form-component", version = "0.5.2" }
gpui-form-component-derive = { path = "crates/gpui-form-component-derive", version = "0.5.2" }
gpui-form-core = { path = "crates/gpui-form-core", version = "0.5.2" }
gpui-form-derive = { path = "crates/gpui-form-derive", version = "0.5.2" }
gpui-form-i18n = { path = "crates/gpui-form-i18n", version = "0.5.2" }
gpui-form-mcp = { path = "crates/gpui-form-mcp", version = "0.5.2" }
gpui-form-prototyping-core = { path = "crates/gpui-form-prototyping-core", version = "0.5.2" }
gpui-form-schema = { path = "crates/gpui-form-schema", version = "0.5.2" }
gpui-kit = "0.7.0"
gpui-kit-assets = "0.7.0"
gpui_platform = { features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], package = "gpui-pre-platform", version = "0.3.7" }
heck = "0.5.0"
phonenumber = "0.3.9"
icu_calendar = "2.2.0"
icu_datetime = "2.2.0"
icu_locale_core = "2.2.0"
inventory = "0.3"
itertools = "0.14"
jiff = "0.2.23"
koruma = "0.9"
koruma-collection = "0.9"
koruma-derive-core = "0.9"
prettyplease = "0.2"
proc-macro-crate = "3.2"
proc-macro-error2 = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
rust-embed = "8.11"
rust_decimal = "1.40"
rmcp = "3.5.0"
rust-i18n = "4"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
strum = "0.28"
syn = "2.0"
syn-cfg-attr = "0.1"
thiserror = "2.0"
unic-langid = "0.9"

[workspace.lints.rust]
unexpected_cfgs = { level = "deny" }

[workspace.lints.clippy]
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
