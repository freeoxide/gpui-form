[package]
name = "freeoxide-gpui-form-core"
description = """
Core helpers for gpui-form.
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "gpui_form_core"
bench = false

[lints]
workspace = true

[features]
default = []
phone = [ "dep:phonenumber" ]

[dependencies]
phonenumber = { optional = true, workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gpui = { workspace = true }
gpui-form = { default-features = false, package = "freeoxide-gpui-form", path = "../gpui-form" }
gpui-form-derive = { package = "freeoxide-gpui-form-derive", path = "../gpui-form-derive" }
gpui-kit = { workspace = true }
koruma = { workspace = true }
koruma-collection = { features = [ "email" ], workspace = true }
serde = { workspace = true }

[[bench]]
name = "state"
harness = false
