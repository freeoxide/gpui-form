[package]
name = "freeoxide-gpui-form-core"
description = """
Core helpers for gpui-form.
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

# The package is published as `freeoxide-gpui-form-core`; the lib target
# keeps its historical name so `::gpui_form_core::...` paths compile
# unchanged.
[lib]
name = "gpui_form_core"

[lints]
workspace = true

[features]
default = []
phone = [ "dep:phonenumber" ]

[dependencies]
phonenumber = { optional = true, workspace = true }
