[package]
name = "freeoxide-gpui-form-component"
description = """
Custom components for gpui-form, including InfiniteSelect for nested enum support
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "gpui_form_component"
bench = false

[features]
default = [  ]
derive = [ "dep:gpui-form-component-derive" ]

[dependencies]
chrono = { workspace = true }
gpui = { workspace = true }
gpui-form-component-derive = { optional = true, workspace = true }
gpui-form-i18n = { workspace = true }
gpui-kit = { workspace = true }
icu_calendar = { workspace = true }
icu_datetime = { workspace = true }
icu_locale_core = { workspace = true }
jiff = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
gpui-form = { package = "freeoxide-gpui-form", path = "../gpui-form" }
gpui-form-component-derive = { package = "freeoxide-gpui-form-component-derive", path = "../gpui-form-component-derive" }
serde_json = { workspace = true }
unic-langid = { workspace = true }

[[bench]]
name = "datefmt"
harness = false

[lints]
workspace = true
