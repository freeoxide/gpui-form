[package]
name = "freeoxide-gpui-form-component"
description = """
Custom components for gpui-form, including InfiniteSelect for nested enum support
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

# The package is published as `freeoxide-gpui-form-component`; the lib
# target keeps its historical name so `::gpui_form_component::...` paths
# compile unchanged.
[lib]
name = "gpui_form_component"
# Keep the libtest unittest binary out of `cargo bench` runs — libtest
# rejects criterion's `--save-baseline` arg (see workspace default-members).
bench = false

[features]
default = [  ]
derive = [ "dep:gpui-form-component-derive" ]

[dependencies]
chrono = { workspace = true }
gpui = { workspace = true }
gpui-form-component-derive = { optional = true, workspace = true }
gpui-form-i18n = { workspace = true }
gpui-kit = { workspace = true }
icu_calendar = { workspace = true }
icu_datetime = { workspace = true }
icu_locale_core = { workspace = true }
jiff = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Integration tests derive `InfiniteSelect`; the derive resolves the
# runtime crate through `proc-macro-crate`, which maps a crate's own
# package name to the sanitized PACKAGE name — no longer the lib name
# under the `freeoxide-` package rename. Depending on the facade here
# gives the tests a resolvable runtime surface (`::gpui_form::infinite_select`
# re-exports this crate's module).
#
# Both intra-set dev-deps are deliberately PATH-ONLY (no `version`): cargo
# drops path-only dev-dependencies from the packaged manifest, so they
# never resolve against crates.io during `cargo publish`. A version-
# carrying dev-dep on the facade would publish-order-cycle (the facade
# depends on this crate) and deadlock the first publish of the set.
criterion = { workspace = true }
gpui-form = { package = "freeoxide-gpui-form", path = "../gpui-form" }
gpui-form-component-derive = { package = "freeoxide-gpui-form-component-derive", path = "../gpui-form-component-derive" }
serde_json = { workspace = true }
unic-langid = { workspace = true }

[[bench]]
name = "datefmt"
harness = false

[lints]
workspace = true
