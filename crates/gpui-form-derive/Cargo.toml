[package]
name = "gpui-form-derive"
description = """
Macro crate for gpui-form
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
darling = { workspace = true }
gpui-form-codegen = { workspace = true }
heck = { workspace = true }
itertools = { workspace = true }
koruma-derive-core = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true, optional = true }
syn = { features = [ "full" ], workspace = true }
syn-cfg-attr = { workspace = true }

[lints]
workspace = true

[features]
default = [  ]
# Reserved for the async-validation wiring phase (forwarded from the facade's
# `async-validation` feature): the `validate(async_fn = ...)` attribute parses
# and records metadata only today, so nothing keys on this flag yet.
async-validation = [ ]
inventory = [  ]
serde = [ "dep:serde" ]

[dev-dependencies]
gpui = { workspace = true }
gpui-form = { default-features = false, path = "../gpui-form" }
gpui-kit = { workspace = true }
koruma = { workspace = true }
koruma-collection = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = "1.0"
