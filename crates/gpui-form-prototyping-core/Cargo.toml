[package]
name = "gpui-form-prototyping-core"
description = """
Consumer-facing prototyping utilities for gpui-form.
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
gpui-form-schema = { workspace = true }
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
rust-i18n = { workspace = true }
syn = { features = [ "full", "parsing" ], workspace = true }

[features]
default = [  ]
# Legacy no-op: emission is rust-i18n-only now; kept until consumers stop
# passing `features = ["fluent"]` (examples/prototyping still does).
fluent = [  ]

[lints]
workspace = true
