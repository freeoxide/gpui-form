[package]
name = "gpui-form"
description = """
The gpui-form crate
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = [ "gpui", "gpui-component", "form" ]

# serde is behind the optional `serde` feature — cargo-machete cannot see
# feature-gated deps, hence the ignore below.
[package.metadata.cargo-machete]
ignored = ["serde"]

[features]
default = [ "derive" ]
derive = [ "dep:gpui-form-derive", "gpui-form-component/derive" ]
inventory = [ "gpui-form-derive?/inventory" ]
phone = [ "gpui-form-core/phone" ]
serde = [ "dep:serde", "gpui-form-derive?/serde" ]

[dependencies]
bon = { workspace = true }
gpui-form-component = { workspace = true }
gpui-form-core = { workspace = true }
gpui-form-derive = { optional = true, workspace = true }
gpui-form-schema = { workspace = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
