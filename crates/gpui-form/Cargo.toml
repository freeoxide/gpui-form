[package]
name = "freeoxide-gpui-form"
description = """
The gpui-form crate
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = [ "gpui", "gpui-component", "form" ]

# The package is published as `freeoxide-gpui-form`; the lib target keeps
# its historical name so `::gpui_form::...` paths compile unchanged.
[lib]
name = "gpui_form"

[features]
default = [ "derive" ]
derive = [ "dep:gpui-form-derive", "gpui-form-component/derive" ]
inventory = [ "gpui-form-derive?/inventory" ]
phone = [ "gpui-form-core/phone" ]
serde = [ "gpui-form-derive?/serde" ]

[dependencies]
bon = { workspace = true }
gpui-form-component = { workspace = true }
gpui-form-core = { workspace = true }
gpui-form-derive = { optional = true, workspace = true }
gpui-form-schema = { workspace = true }

[dev-dependencies]
koruma = { workspace = true }
koruma-collection = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
