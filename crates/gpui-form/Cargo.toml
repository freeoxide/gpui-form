[package]
name = "gpui-form"
description = """
The gpui-form crate
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = [ "gpui", "gpui-component", "form" ]

[features]
default = [ "derive" ]
# Reserved for the async-validation wiring phase: `validate(async_fn = ...)`
# parses and records metadata only; no runtime code depends on the flag yet.
async-validation = [ "gpui-form-derive?/async-validation" ]
derive = [ "dep:gpui-form-derive", "gpui-form-component/derive" ]
inventory = [ "gpui-form-derive?/inventory" ]
phone = [ "gpui-form-core/phone" ]
serde = [ "gpui-form-derive?/serde" ]

[dependencies]
bon = { workspace = true }
gpui-form-component = { workspace = true }
gpui-form-core = { workspace = true }
gpui-form-derive = { optional = true, workspace = true }
gpui-form-schema = { workspace = true }

[dev-dependencies]
koruma = { workspace = true }
koruma-collection = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
