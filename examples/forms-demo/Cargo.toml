[package]
name = "forms-demo"
version = "0.1.0"
edition.workspace = true
license = "Unlicense"
publish = false

[dependencies]
chrono = { workspace = true }
derive_more = { features = [ "full" ], workspace = true }
gpui = { workspace = true }
gpui-form = { features = [ "derive" ], workspace = true }
gpui-kit = { workspace = true }
koruma = { workspace = true }
koruma-collection = { features = [ "email" ], workspace = true }
rust-i18n = { workspace = true }
serde = { features = [ "derive" ], optional = true, workspace = true }
strum = { workspace = true }
unic-langid = { workspace = true }

[features]
serde = [ "dep:serde", "gpui-form/serde", "chrono/serde" ]

[package.metadata.cargo-machete]
ignored = [ "gpui", "gpui-kit", "derive_more" ]
