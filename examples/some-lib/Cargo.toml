[package]
name = "some-lib"
version = "0.1.0"
edition.workspace = true
license = "Unlicense"
publish = false

[lib]
bench = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
derive_more = { features = [ "full" ], workspace = true }
gpui = { workspace = true }
gpui-form = { features = [ "derive", "phone" ], workspace = true }
gpui-kit = { workspace = true }
koruma = { workspace = true }
koruma-collection = { features = [ "rust_decimal", "email" ], workspace = true }
rust-i18n = { workspace = true }
rust_decimal = { workspace = true }
serde = { features = [ "derive" ], optional = true, workspace = true }
strum = { workspace = true }

[dev-dependencies]
gpui-form-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = [ "ui", "validation" ]
serde = [
    "dep:serde",
    "gpui-form/serde",
    "chrono/serde",
    "rust_decimal/serde",
]
ui = [  ]
validation = [  ]

[package.metadata.cargo-machete]
ignored = [ "gpui", "gpui-kit" ]
